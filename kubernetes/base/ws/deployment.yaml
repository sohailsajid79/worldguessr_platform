apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ws
  template:
    metadata:
      labels:
        app: ws
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: ws
          image: worldguessr-ws
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: state
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
        - name: cron-proxy
          image: alpine/socat:1.8.0.0
          args: ["TCP-LISTEN:3003,fork,reuseaddr", "TCP:cron:3003"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ws-state